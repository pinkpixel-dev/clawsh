[package]
name = "clawsh-web"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ratzilla = "0.3.1"
# The same ratatui Ratzilla uses; the shared protocol file names it directly.
ratatui = { version = "0.30", default-features = false }
critical-section = { version = "1.2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "ClipboardEvent", "CompositionEvent", "DataTransfer", "CssStyleDeclaration", "Document", "DomRect", "Element",
  "Event", "EventTarget", "HtmlElement", "HtmlTextAreaElement", "InputEvent",
  "KeyboardEvent", "Location", "MessageEvent", "MouseEvent", "NodeList", "PointerEvent", "VisualViewport",
  "WebSocket", "WheelEvent", "Window",
] }
