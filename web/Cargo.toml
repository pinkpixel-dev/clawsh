[package]
name = "clawsh-web"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ratzilla = "0.3.1"
critical-section = { version = "1.2", features = ["std"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "ClipboardEvent", "CompositionEvent", "DataTransfer", "CssStyleDeclaration", "Document", "DomRect", "Element",
  "Event", "EventTarget", "HtmlElement", "HtmlTextAreaElement", "InputEvent",
  "KeyboardEvent", "MouseEvent", "NodeList", "PointerEvent", "VisualViewport",
  "WheelEvent", "Window",
] }
