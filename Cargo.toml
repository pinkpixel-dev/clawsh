[package]
name = "clawsh-tui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Claw$h, a ratatui workspace shell for Claude Code sessions"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.29"
libghostty-vt = "0.2.2"
png = "0.18"
portable-pty = "0.9"
ratatui = { version = "0.30", features = ["underline-color"] }
serde_json = "1"

[[bin]]
name = "clawsh"
path = "src/main.rs"
