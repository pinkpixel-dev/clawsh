[package]
name = "clawsh-tui"
version = "1.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Claw$h, a ratatui workspace shell for Claude Code sessions"
repository = "https://github.com/pinkpixel-dev/clawsh"
homepage = "https://github.com/pinkpixel-dev/clawsh"
readme = "README.md"
keywords = ["claude", "tui", "terminal", "ratatui", "multiplexer"]
categories = ["command-line-utilities"]
# `web-dist` is gitignored, so it only gets packaged because it's listed
# here. Build it first (scripts/publish.sh does).
include = [
  "/src/**",
  "/web-dist/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/icon.png",
  "/screenshot.png",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/clawsh-{ target }.tar.gz"
bin-dir = "clawsh-{ target }/{ bin }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
httparse = "1"
libc = "0.2"
libghostty-vt = "0.2.2"
png = "0.18"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13.4", default-features = false }
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30", features = ["underline-color"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
tungstenite = "0.30"
ureq = "3"

[[bin]]
name = "clawsh"
path = "src/main.rs"
