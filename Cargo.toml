[package]
name = "clawsh-tui"
version = "1.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Claw$h, a ratatui workspace shell for Claude Code sessions"
repository = "https://github.com/pinkpixel-dev/clawsh"
homepage = "https://github.com/pinkpixel-dev/clawsh"
readme = "README.md"
keywords = ["claude", "tui", "terminal", "ratatui", "multiplexer"]
categories = ["command-line-utilities"]
exclude = ["/scripts", "/.github"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/clawsh-{ target }.tar.gz"
bin-dir = "clawsh-{ target }/{ bin }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
crossterm = "0.29"
libc = "0.2"
libghostty-vt = "0.2.2"
png = "0.18"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30", features = ["underline-color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = "3"

[[bin]]
name = "clawsh"
path = "src/main.rs"
