[package]
name = "clawsh-tui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Claw$h, a ratatui workspace shell for Claude Code sessions"

[dependencies]
anyhow = "1"
crossterm = "0.29"
libghostty-vt = { version = "0.2.2", features = ["png"] }
portable-pty = "0.9"
ratatui = { version = "0.30", features = ["underline-color"] }

[[bin]]
name = "clawsh"
path = "src/main.rs"
