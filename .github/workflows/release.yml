# Builds Linux binaries when a v* tag is pushed and attaches them to a GitHub
# release. libghostty-vt-sys builds Ghostty with Zig, which needs 0.15.x exactly.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The phone client is wasm, so it's the same for every target. Build it once
  # and hand it to each build job, which embeds it in the binary.
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Build the phone client
        working-directory: web
        run: trunk build --release
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web-dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          cache-key: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist
      # Without it the binary still builds, just with no phone client.
      - name: Check the phone client is there
        run: test -f web-dist/index.html

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          dir="clawsh-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/clawsh" LICENSE README.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: clawsh-${{ matrix.target }}
          path: clawsh-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: clawsh-*.tar.gz*
          generate_release_notes: true
